<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Custom action icons — OGPlayer</title>
<link rel="stylesheet" href="./assets/demo.css">
</head>
<body>
<div class="wrap">
  <og-player id="pl"><span slot="top-end" id="wm" hidden
    style="background:rgba(0,0,0,.5);color:#fff;font-size:14px;font-weight:600;padding:5px 10px">WATERMARK</span></og-player>
  <div id="boxes" style="margin-top:14px"></div>
  <p class="note">White icons sit inline in the top-end control row and hide with the
  controls; each tap fires the host callback (logged below). While NICAM icons show,
  the whole button row drops below them and glides back; the watermark stays below
  the line.</p>
  <div class="log" id="log"></div>
  <footer class="demo" id="foot"></footer>
</div><script type="importmap">{ "imports": { "ogplayer": "./node_modules/ogplayer/dist/ogplayer.js" } }</script>
<script type="module">
import { OGPlayer } from "ogplayer";
import { pageHeader, makeLog, attachEventLogging, TOS, FOOTER } from "./assets/demo.js";

pageHeader("Custom action icons", "Up to 8 of your own icons inline in the controls, with callbacks.");
document.getElementById("foot").textContent = FOOTER;

const paths = [
  ["share", "M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92zM18 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM6 13c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm12 7.02c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"],
  ["favorite", "M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"],
  ["info", "M11 7h2v2h-2zm0 4h2v6h-2zm1-9C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"],
  ["star", "M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"],
  ["search", "M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"],
  ["chat", "M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"],
  ["download", "M19 9h-4V3H9v6H5l7 7 7-7zm-8 2V5h2v6h1.17L12 13.17 9.83 11H11zm-6 7h14v2H5v-2z"],
  ["clock", "M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zm.01 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"],
];
const svg = (d) => `<svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="${d}"/></svg>`;

const player = new OGPlayer();
const el = document.getElementById("pl");
el.player = player;
const log = makeLog(document.getElementById("log"));
attachEventLogging(player, log);

const enabled = new Set([0, 1]);
let watermark = false, nicam = false;

function apply() {
  el.config = {
    customActions: [...enabled].sort((a, b) => a - b).map((i) => ({
      svg: svg(paths[i][1]),
      accessibilityLabel: `Icon ${i + 1}`,
      onClick: () => log(`custom icon${i + 1} tap callback`),
    })),
  };
  document.getElementById("wm").hidden = !watermark;
}
function loadItem() {
  player.load({
    url: TOS, title: "Custom actions demo",
    ...(nicam ? { contentRatings: [{ age: "SIXTEEN" }, { descriptor: "FEAR" }] } : {}),
  });
  apply(); // config resets on mount
}

const boxes = document.getElementById("boxes");
paths.forEach(([name, d], i) => {
  const l = document.createElement("label");
  l.className = "cb";
  l.innerHTML = `<input type="checkbox" ${enabled.has(i) ? "checked" : ""}>${svg(d)}`;
  l.querySelector("input").addEventListener("change", (e) => {
    e.target.checked ? enabled.add(i) : enabled.delete(i);
    apply();
  });
  boxes.appendChild(l);
});
const extra = (label, cb) => {
  const l = document.createElement("label");
  l.className = "cb";
  l.innerHTML = `<input type="checkbox"><span style="font-size:15px">${label}</span>`;
  l.querySelector("input").addEventListener("change", (e) => cb(e.target.checked));
  boxes.appendChild(l);
};
boxes.appendChild(document.createElement("br"));
extra("Watermark", (v) => { watermark = v; apply(); });
extra("NICAM (reloads)", (v) => { nicam = v; log("— reloading —"); loadItem(); });

log("— loading —");
loadItem();
</script>
</body>
</html>
